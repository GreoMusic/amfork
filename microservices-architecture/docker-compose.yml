version: '3.8'

services:
  # Keep only services that exist in this repo for local testing

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: acadex-api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=dev-jwt-secret-change-me
      - AUTH_SERVICE_URL=http://localhost:3001
      - CLASS_SERVICE_URL=http://localhost:3002
      - ASSIGNMENT_SERVICE_URL=http://localhost:3003
      - GRADING_SERVICE_URL=http://localhost:3004
      - FILE_SERVICE_URL=http://localhost:3005
      - SUBSCRIPTION_SERVICE_URL=http://localhost:3006
      - NOTIFICATION_SERVICE_URL=http://localhost:3007
      - ANALYTICS_SERVICE_URL=http://localhost:3008
      - FRONTEND_URL=http://localhost:5173
    networks:
      - acadex-network
    volumes:
      - ./api-gateway:/app
      - /app/node_modules

  # Test Teacher Dashboard
  test-teacher-dashboard:
    build:
      context: ./test-teacher-dashboard
      dockerfile: Dockerfile
    container_name: acadex-test-teacher-dashboard
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=development
      - PORT=3009
      - CORS_ORIGIN=http://localhost:5173
    networks:
      - acadex-network
    volumes:
      - ./test-teacher-dashboard:/app
      - /app/node_modules

  # Test Student Dashboard
  test-student-dashboard:
    build:
      context: ./test-student-dashboard
      dockerfile: Dockerfile
    container_name: acadex-test-student-dashboard
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=development
      - PORT=3010
      - LISA_URL=http://host.docker.internal:5001
    networks:
      - acadex-network
    volumes:
      - ./test-student-dashboard:/app
      - /app/node_modules

networks:
  acadex-network:
    driver: bridge